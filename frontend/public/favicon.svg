<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="leafAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Fundo Branco Squircle idêntico ao logo da Sidebar -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- Ícone Sprout (SmartFarm) em natureGreen -->
  <g transform="translate(10.4, 10.4) scale(1.8)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Solo / Base -->
    <path d="M7 20h10" stroke="#2E7D32" stroke-width="2.2"/>
    
    <!-- Caule / Haste Principal -->
    <path d="M10 20c5.5-2.5.8-6.4 3-10" stroke="#2E7D32" stroke-width="2.2"/>
    
    <!-- Folha Esquerda -->
    <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z" fill="url(#leafAccent)" stroke="#2E7D32" stroke-width="1.8"/>
    
    <!-- Folha Direita -->
    <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z" fill="url(#leafAccent)" stroke="#2E7D32" stroke-width="1.8"/>
  </g>
</svg>
